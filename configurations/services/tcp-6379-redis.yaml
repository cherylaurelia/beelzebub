apiVersion: "v1"
protocol: "tcp"
address: ":6379"
description: "Redis 7.0.12"
banner: ""
commands:
  - regex: "(?is)^(\\*\\d+\\r\\n\\$\\d+\\r\\n)?HELLO(\\r\\n\\$\\d+\\r\\n| +)3"
    handler: "%7\r\n$6\r\nserver\r\n$5\r\nredis\r\n$7\r\nversion\r\n$6\r\n7.0.12\r\n$5\r\nproto\r\n:3\r\n$2\r\nid\r\n:1\r\n$4\r\nmode\r\n$10\r\nstandalone\r\n$4\r\nrole\r\n$6\r\nmaster\r\n$7\r\nmodules\r\n*0\r\n"
    name: "hello"
  - regex: "(?is)^(\\*\\d+\\r\\n\\$\\d+\\r\\n)?PING"
    handler: "+PONG\r\n"
    name: "ping"
  - regex: "(?is)^(\\*\\d+\\r\\n\\$\\d+\\r\\n)?AUTH"
    handler: "-ERR AUTH <password> called without any password configured for the default user. Are you sure your configuration is correct?\r\n"
    name: "auth"
  - regex: "(?is)^(\\*\\d+\\r\\n\\$\\d+\\r\\n)?INFO"
    handler: "$124\r\n# Server\r\nredis_version:7.0.12\r\nos:Linux x86_64\r\ntcp_port:6379\r\nuptime_in_seconds:0\r\nuptime_in_days:0\r\nconnected_clients:1\r\n\r\n"
    name: "info"
  - regex: "(?is)^(\\*\\d+\\r\\n\\$\\d+\\r\\n)?CONFIG(\\r\\n\\$\\d+\\r\\n| +)SET\\b"
    handler: "+OK\r\n"
    name: "config_set"
  - regex: "(?is)^(\\*\\d+\\r\\n\\$\\d+\\r\\n)?CONFIG(\\r\\n\\$\\d+\\r\\n| +)GET(\\r\\n\\$\\d+\\r\\n| +)dir\\b"
    handler: "*2\r\n$3\r\ndir\r\n$5\r\n/data\r\n"
    name: "config_get_dir"
  - regex: "(?is)^(\\*\\d+\\r\\n\\$\\d+\\r\\n)?CONFIG(\\r\\n\\$\\d+\\r\\n| +)GET(\\r\\n\\$\\d+\\r\\n| +)dbfilename\\b"
    handler: "*2\r\n$10\r\ndbfilename\r\n$8\r\ndump.rdb\r\n"
    name: "config_get_dbfilename"
  - regex: "(?is)^(\\*\\d+\\r\\n\\$\\d+\\r\\n)?BGSAVE\\b"
    handler: "+Background saving started\r\n"
    name: "bgsave"
  - regex: "(?is)^(\\*\\d+\\r\\n\\$\\d+\\r\\n)?(SET|FLUSHALL|FLUSHDB|SAVE|SLAVEOF|REPLICAOF)\\b"
    handler: "+OK\r\n"
    name: "write"
  - regex: "(?is)^(\\*\\d+\\r\\n\\$\\d+\\r\\n)?KEYS\\b"
    handler: "*0\r\n"
    name: "keys"
  - regex: "(?s)^.+$"
    handler: "-ERR unknown command\r\n"
    name: "catch_all"
deadlineTimeoutSeconds: 60
serverName: "redis"
