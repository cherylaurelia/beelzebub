apiVersion: "v1"
protocol: "tcp"
wireEncoding: "latin1"
framing:
  # MySQL packets start with a 3-byte little-endian payload length and a sequence byte.
  mode: "length-prefix"
  lengthOffset: 0
  lengthSize: 3
  headerSize: 4
  bigEndian: false
address: ":3306"
description: "Mysql 8.0.29"
# Protocol 10 greeting. The runtime appends "\n" to every banner, so the declared
# payload length includes that byte. The salt is static.
banner: "\x4b\x00\x00\x00\x0a\x38\x2e\x30\x2e\x32\x39\x00\x08\x00\x00\x00\x1f\x6a\x3c\x52\x07\x41\x68\x2d\x00\x0f\xa2\xff\x02\x00\x18\x00\x15\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x39\x12\x5e\x74\x0b\x63\x2a\x48\x15\x7d\x31\x56\x00\x63\x61\x63\x68\x69\x6e\x67\x5f\x73\x68\x61\x32\x5f\x70\x61\x73\x73\x77\x6f\x72\x64\x00"
commands:
  - regex: "(?s)^.{3}\\x01"
    handler: "\x16\x00\x00\x02\xff\x15\x04\x23\x32\x38\x30\x30\x30\x41\x63\x63\x65\x73\x73\x20\x64\x65\x6e\x69\x65\x64"
    name: "login_denied"
    closeAfter: true
  - regex: "(?s)^.+$"
    handler: ""
    name: "catch_all"
deadlineTimeoutSeconds: 10
